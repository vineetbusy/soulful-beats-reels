name: Soulful Beats Daily 24x7 Reel Publisher

on:
  schedule:
    # IST is UTC + 5:30
    # Monday: 10:30 PM IST -> 17:00 UTC
    - cron: '0 17 * * 1'
    # Tuesday: 8:00 PM IST -> 14:30 UTC
    - cron: '30 14 * * 2'
    # Wednesday: 8:00 PM IST -> 14:30 UTC
    - cron: '30 14 * * 3'
    # Thursday: 8:30 PM IST -> 15:00 UTC
    - cron: '0 15 * * 4'
    # Friday: 11:00 PM IST -> 17:30 UTC
    - cron: '30 17 * * 5'
    # Saturday: 7:30 PM IST -> 14:00 UTC
    - cron: '0 14 * * 6'
    # Sunday: 8:00 PM IST -> 14:30 UTC
    - cron: '30 14 * * 0'
  workflow_dispatch: # Allows manual 1-click test run anytime

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Instagram Session from Secrets
        env:
          INSTA_SESSION: ${{ secrets.INSTA_SESSION_JSON }}
        run: |
          echo "$INSTA_SESSION" > insta_session.json

      - name: Run Safe Reel Publish Pipeline
        run: |
          python auto_reels_pipeline.py upload

      - name: Commit and Push Updated Queue
        run: |
          git config --global user.name "SoulfulBeats-Bot"
          git config --global user.email "bot@soulfulbeats.com"
          git add content_queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update content queue after successful reel publish" && git push)
